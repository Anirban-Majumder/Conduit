[package]
name = "mcp-router"
version = "0.0.1"
edition = "2021"
description = "Polished MCP proxy + policy enforcer for IDEs"
repository = "https://github.com/ahmed/mcp-router"  # TODO: replace with actual repo URL on push
license = "Apache-2.0"

# Dependencies populated as phases land. See specs/mcp-router-v0.md §Stack.
# Stage 1 subset: only what the foundation (runtime topology, DB actor,
# events broadcast, errors, Slint shell) directly needs. Subsequent stages
# add axum, rmcp, reqwest, serde, toml, keyring, dirs, notify, tray-icon,
# notify-rust, global-hotkey, tracing-appender, clap, sysinfo, and per-OS deps.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"

slint = { version = "1", features = ["backend-winit", "renderer-skia"] }

# HTTP server (the daemon's IDE-facing surface — bound to 127.0.0.1)
axum = "0.8"

# MCP wire protocol — tilde pin: minor bumps are deliberate work, patches OK
rmcp = { version = "~1.7", features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    # Without `reqwest`, rmcp's transport-streamable-http-client-reqwest brings
    # in reqwest 0.13 WITHOUT a TLS connector, so https:// upstreams fail with
    # "scheme is not http". Enabling `reqwest` flips on `reqwest?/rustls`.
    "reqwest",
    "auth",
] }

# rustls only — openssl is banned in deny.toml
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

rusqlite = { version = "0.39", features = ["bundled"] }

# Settings + paths
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"

thiserror = "2"
anyhow = "1"

# 8-char random alphanumeric IDE keys per spec §Add IDE flow
rand = "0.9"

# UUIDs for keyring secret references (one per env var)
uuid = { version = "1", features = ["v4"] }

# Per-OS OS keyring for secret env vars + OAuth tokens.
# keyring v4 split the client API into keyring-core; both are required.
keyring = "4"
keyring-core = { version = "1", features = ["sample"] }

# IDE auto-detect uses std::env / std::fs directly — no sysinfo needed in v0
# (sysinfo's strength is process inspection, not what we want for IDE detection).

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Notifications + GUI focus hotkey.
notify-rust = "4"
global-hotkey = "0.8"

# §3 health card "Copy error" button: writes the rendered error chain to the
# system clipboard.
arboard = "3"

# §6: system tray icon with menu and badge state. muda (transitive) needs
# libxdo at link time on Linux — install via `pacman -S xdotool` /
# `apt install libxdo-dev`. Runtime tray uses StatusNotifierItem over DBus,
# so Wayland desktops (Hyprland + Caelestia, etc.) display correctly.
tray-icon = "0.24"

# tray-icon's Linux backend constructs GTK menu items; gtk::init() must be
# called from the thread that owns the menu before any of the GTK objects
# are constructed, or muda panics with "GTK has not been initialized".
# Version pinned to match what tray-icon's transitive `muda` already uses
# so we share one gtk-rs instance.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# §1: single-instance IPC over Unix sockets / Windows named pipes.
interprocess = { version = "2", features = ["tokio"] }

# §2: probe-time secret values stay zeroized in memory until step-3 Save.
zeroize = { version = "1", features = ["zeroize_derive"] }

# §5 OAuth: open the authorize URL in the user's default browser.
open = "5"

# §5 OAuth PKCE math: SHA-256 of the verifier, base64url encoded.
sha2 = "0.10"
base64 = "0.22"

[build-dependencies]
slint-build = "1"

# Single-binary GUI app; release profile optimized for distribution size.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

# Profiling builds: optimized but with symbols.
[profile.release-debug]
inherits = "release"
strip = "none"
debug = "full"
lto = "thin"

# ─────────────────────────────────────────────────────────────
# Lints — enforced via `cargo clippy -- -D warnings` in CI.
# See CLAUDE.md for rationale on each category.
# ─────────────────────────────────────────────────────────────

[lints.rust]
# `deny` (not `forbid`): Slint's generated code uses #[allow(unsafe_code)] for
# FFI into its runtime; `forbid` cannot be overridden by `allow`, so it makes
# any slint! macro use a compile error. `deny` still rejects unsafe we write.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
# Note: clippy::let_underscore_must_use is broader; we use that instead.

[lints.clippy]
# Baseline groups (priority = -1 lets specific overrides win)
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Hard bans — the panic/unwrap/print family
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Async footguns
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
future_not_send = "warn"
large_futures = "warn"
let_underscore_future = "deny"
if_let_mutex = "warn"

# Panic-adjacent / runtime correctness
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
mem_forget = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"

# Cast hygiene (AI tends to lose precision silently)
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

# Size / cost hygiene
large_enum_variant = "warn"
large_stack_arrays = "warn"

# Silent-failure family
let_underscore_must_use = "warn"
map_err_ignore = "warn"

# Style upgrades that catch AI-shaped code
manual_let_else = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
rc_mutex = "warn"

# Suppression discipline
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Pedantic items dialed back — too noisy for app code
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
