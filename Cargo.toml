[package]
name = "conduit"
version = "0.0.1"
edition = "2021"
description = "MCPs and skills, synced to every IDE."
repository = "https://github.com/ahmed/conduit"  # TODO: replace with actual repo URL on push
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "fs", "io-util"] }
tokio-util = "0.7"

slint = { version = "1", features = ["backend-winit", "renderer-skia"] }

axum = "0.8"

# tilde pin: minor bumps are deliberate work, patches OK
rmcp = { version = "~1.7", features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    "reqwest",  # without this, https:// upstreams fail ("scheme is not http") — no TLS connector
    "auth",
] }

# rustls only (openssl banned in deny.toml); 0.13 matches rmcp's internal reqwest
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

rusqlite = { version = "0.39", features = ["bundled"] }

dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
notify = "8"

thiserror = "2"
anyhow = "1"

async-trait = "0.1"  # must match rmcp's #[async_trait] CredentialStore macro crate

rand = "0.9"
uuid = { version = "1", features = ["v4"] }

keyring = "4"
keyring-core = { version = "1", features = ["sample"] }  # keyring v4 split client API out; both required

# grandchild cleanup: Job Object (Windows) / process group (Unix)
process-wrap = { version = "9", features = ["tokio1", "job-object", "creation-flags", "process-group"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

notify-rust = "4"
global-hotkey = "0.8"
arboard = "3"

# needs libxdo at link time on Linux: pacman -S xdotool / apt install libxdo-dev
tray-icon = "0.24"

interprocess = { version = "2", features = ["tokio"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
open = "5"
sha2 = "0.10"
base64 = "0.22"
toml_edit = "0.25.12"
arc-swap = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"  # pinned to match tray-icon's transitive muda — share one gtk-rs instance

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[build-dependencies]
slint-build = "1"

# Single-binary GUI app; release profile optimized for distribution size.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

# Profiling builds: optimized but with symbols.
[profile.release-debug]
inherits = "release"
strip = "none"
debug = "full"
lto = "thin"

# Lints — enforced via `cargo clippy -- -D warnings` in CI.
[lints.rust]
unsafe_code = "deny"  # not forbid: Slint's generated code uses #[allow(unsafe_code)]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Baseline groups (priority = -1 lets specific overrides win)
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Hard bans — the panic/unwrap/print family
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Async footguns
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
future_not_send = "warn"
large_futures = "warn"
let_underscore_future = "deny"
if_let_mutex = "warn"

# Panic-adjacent / runtime correctness
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
mem_forget = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"

# Cast hygiene (AI tends to lose precision silently)
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

# Size / cost hygiene
large_enum_variant = "warn"
large_stack_arrays = "warn"

# Silent-failure family
let_underscore_must_use = "warn"
map_err_ignore = "warn"

# Style upgrades that catch AI-shaped code
manual_let_else = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
rc_mutex = "warn"

# Suppression discipline
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Pedantic items dialed back — too noisy for app code
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
